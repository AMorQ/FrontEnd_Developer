<!-- ejercicio 2: inverted string -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spelling Backwards</title>
  <link rel="stylesheet" href="../../src/assets/main.css">
</head>
<body>
  <h1>Reversed String</h1>

  <label for="textInput">Ingrese un texto:</label>
  <input type="text" id="textInput" onkeydown="handleKeyDown(event)">
  <button onclick="reverseString()">¿Podrás leerme?</button>
  <p id="result"></p>
  <a href="/index.html" class="back-button">Volver a la página principal</a>
  
  <script>
    function reverseString() {
  const textInput = document.getElementById("textInput");
//   #whats this? text Input is a reference to a DOM element, which are JS representations of HTML elements
  const inputValue = textInput.value;


  const resultElement = document.getElementById("result");

//   comprobar que sea un caracter string no vacío  
  if (inputValue === "") {
    resultElement.textContent = "El campo no puede estar vacío";
  } else {
    const reversedString = inputValue.split("").reverse().join("");
    resultElement.textContent = "Texto invertido: " + reversedString;
  }
}

function handleKeyDown(event) {
  if (event.key === "Enter") {
    reverseString();
  }
}
  </script>
</body>
</html>
