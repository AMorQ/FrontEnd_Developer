<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>¿Par o Impar?</title>
</head>
<body>
  <h1>Par o Impar?</h1>

  <label for="numberInput">Ingrese un número:</label>
  <input type="number" id="numberInput" onkeydown="handleKeyDown(event)">
  <button onclick="parOimpar()">¿Qué será?</button>
  <p id="result"></p>

  <script>
    function parOimpar() {
      const numero = parseInt(document.getElementById("numberInput").value);
      const resultado = document.getElementById("result");

      if (isNaN(numero)) {
        resultado.textContent = "Por favor, ingrese un número válido.";
        return;
      }

      if (numero % 2 === 0) {
        resultado.textContent = "El número es par.";
      } else {
        resultado.textContent = "El número es impar.";
      }
    }

    function handleKeyDown(event) {
      if (event.key === "Enter") {
        parOimpar();
      }
    }
  </script>
</body>
</html>
