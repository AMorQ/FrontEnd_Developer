<!-- 10 - Crear un programa que convierta grados Celsius a Fahrenheit y viceversa.  -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 10 - Conversión de Grados</title>
</head>
<body>
  <h1>Conversión de Grados</h1>
<label for="celsiusInput">Grados Celsius:</label>
<input type="text" id="celsiusInput" onkeydown="handleKeyDown(event)">
<button onclick="convertToFahrenheit()">Convertir a Fahrenheit</button>

<label for="fahrenheitInput">Grados Fahrenheit:</label>
<input type="text" id="fahrenheitInput" onkeydown="handleKeyDown(event)">
<button onclick="convertToCelsius()">Convertir a Celsius</button>


<p id="result"></p>
  <script>
    function convertToFahrenheit() {
    const celsiusInput = document.getElementById("celsiusInput");
    const celsius = celsiusInput.value;
    const resultElement = document.getElementById("result");
    if (!celsius) {
        resultElement.textContent = "Por favor, ingrese grados Celsius.";
    } else if (isNaN(celsius)) {
        resultElement.textContent = "Por favor, ingrese un número válido.";
    } else {
        const fahrenheit = (celsius * 9/5) + 32;
        resultElement.textContent = `${celsius}°C son ${fahrenheit}°F.`;
    }
}

function convertToCelsius() {
    const fahrenheitInput = document.getElementById("fahrenheitInput");
    const fahrenheit = fahrenheitInput.value;
    const resultElement = document.getElementById("result");
    if (!fahrenheit) {
        resultElement.textContent = "Por favor, ingrese grados Fahrenheit.";
    } else if (isNaN(fahrenheit)) {
        resultElement.textContent = "Por favor, ingrese un número válido.";
    } else {
        const celsius = (fahrenheit - 32) * 5/9;
        resultElement.textContent = `${fahrenheit}°F son ${celsius}°C.`;
    }
}


function handleKeyDown(event) {
    if (event.key === "Enter" && event.target.id === "celsiusInput") {
        convertToFahrenheit();
    } else if (event.key === "Enter" && event.target.id === "fahrenheitInput") {
        convertToCelsius(); 
    }
}
  </script>
</body>
</html>
